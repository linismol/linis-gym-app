/* ===== Nimbus design tokens (from the imported design system) ===== */
:root{
  --pink-50:#fef2f4;--pink-100:#fde3e8;--pink-200:#fbc9d3;--pink-300:#f7a1b2;--pink-400:#f66f89;--pink-500:#F24B6A;--pink-600:#dd2f52;--pink-700:#ba2143;--pink-800:#8f1c39;--pink-900:#6b1a32;
  --navy-50:#eef4fa;--navy-100:#d6e5f2;--navy-200:#aecae3;--navy-300:#7ba9cd;--navy-400:#4783b0;--navy-500:#215f8c;--navy-600:#0f4874;--navy-700:#023E73;--navy-800:#023262;--navy-900:#032850;
  --yellow-50:#fefbea;--yellow-100:#fdf3c2;--yellow-200:#fbe685;--yellow-300:#f7d947;--yellow-400:#F2D230;--yellow-500:#d9b81a;--yellow-600:#b1930f;--yellow-700:#87700e;--yellow-800:#665711;--yellow-900:#4a3f0f;
  --orange-50:#fdf6ec;--orange-100:#fbe9cd;--orange-200:#f6d19c;--orange-300:#f2b263;--orange-400:#F2B263;--orange-500:#e6923a;--orange-600:#c9752a;--orange-700:#a15a22;--orange-800:#7a4522;--orange-900:#5c371f;
  --gray-0:#ffffff;--gray-50:#F2F2F2;--gray-100:#e7e8ea;--gray-200:#d3d5d9;--gray-300:#b4b8c0;--gray-400:#8c92a0;--gray-500:#6c7384;--gray-600:#525a6c;--gray-700:#3c4356;--gray-800:#262c3d;--gray-900:#151925;--gray-950:#0b0d14;
  --success-500:#2f9e63;--success-100:#dcf5e7;--danger-500:#dd2f52;--danger-100:#fde3e8;
  --surface-page:var(--gray-50);--surface-raised:var(--gray-0);--surface-sunken:var(--gray-100);
  --surface-brand:var(--navy-700);
  --text-primary:var(--gray-900);--text-secondary:var(--gray-600);--text-tertiary:var(--gray-400);
  --text-on-brand:var(--gray-0);--text-link:var(--navy-700);
  --border-default:var(--gray-200);--border-strong:var(--gray-300);--border-focus:var(--navy-500);
  --accent-primary:var(--pink-500);--accent-primary-hover:var(--pink-600);--accent-primary-active:var(--pink-700);
  --font-body:"Inter Tight",system-ui,-apple-system,sans-serif;
  --font-display:"Inter Tight",system-ui,-apple-system,sans-serif;
  --text-xs:12px;--text-sm:13px;--text-base:15px;--text-md:16px;--text-lg:18px;--text-xl:22px;--text-2xl:28px;--text-3xl:36px;
  --leading-tight:1.1;--leading-snug:1.25;--leading-normal:1.45;--leading-relaxed:1.65;
  --tracking-tight:-0.02em;--tracking-wide:0.04em;
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;--weight-black:800;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(3,40,80,0.06),0 1px 1px rgba(3,40,80,0.04);
  --shadow-md:0 4px 12px rgba(3,40,80,0.08),0 2px 4px rgba(3,40,80,0.05);
  --shadow-lg:0 12px 32px rgba(3,40,80,0.14),0 4px 10px rgba(3,40,80,0.06);
  --shadow-focus:0 0 0 3px rgba(33,95,140,0.25);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --duration-fast:120ms;--duration-base:200ms;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--gray-100);font-family:var(--font-body);color:var(--text-primary);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
a{color:var(--text-link);}
a:hover{color:var(--pink-600);}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface-page);box-shadow:var(--shadow-lg);}

/* ===== Sticky header ===== */
.hdr{position:sticky;top:0;z-index:20;background:var(--surface-page);border-bottom:1px solid var(--border-default);padding-top:env(safe-area-inset-top,0px);}
.hdr-top{padding:16px 20px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.eyebrow{font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);}
.hdr h1{margin:6px 0 0;font-family:var(--font-display);font-size:var(--text-2xl);font-weight:var(--weight-black);letter-spacing:var(--tracking-tight);line-height:var(--leading-tight);color:var(--navy-700);}
.view-toggle{flex:none;margin-top:2px;background:none;border:none;cursor:pointer;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--surface-brand);white-space:nowrap;padding:4px 0;}
.daytabs{display:flex;overflow-x:auto;padding:6px 12px 0;gap:2px;scrollbar-width:none;}
.daytabs::-webkit-scrollbar{display:none;}
.daytab{padding:10px 14px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--weight-semibold);white-space:nowrap;color:var(--text-tertiary);transition:color var(--duration-fast) var(--ease-out);}
.daytab.active{color:var(--surface-brand);border-bottom-color:var(--accent-primary);}

/* ===== Day intro ===== */
.day-focus{padding:14px 20px 4px;font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-normal);}
.knee-note{margin:10px 20px 0;padding:10px 14px;background:var(--pink-50);border:1px solid var(--pink-200);border-radius:var(--radius-md);font-size:var(--text-xs);color:var(--pink-700);line-height:var(--leading-snug);}
.legend{display:flex;gap:8px;margin:14px 20px 4px;flex-wrap:wrap;}

/* ===== Tag ===== */
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;background:var(--surface-sunken);border:1px solid var(--border-default);border-radius:var(--radius-pill);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary);white-space:nowrap;}

/* ===== Badge ===== */
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-pill);font-size:11px;line-height:1;font-weight:var(--weight-semibold);letter-spacing:0.01em;white-space:nowrap;}
.badge--pink{background:var(--pink-100);color:var(--pink-700);}
.badge--orange{background:var(--orange-100);color:var(--orange-700);}
.badge--yellow{background:var(--yellow-100);color:var(--yellow-800);}
.badge--brand{background:var(--navy-100);color:var(--navy-700);}
.badge--neutral{background:var(--surface-sunken);color:var(--text-secondary);}

/* ===== Exercise list ===== */
.list{padding:16px 20px 40px;display:flex;flex-direction:column;gap:12px;}
.ex{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;}
.ex-head{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.ex-tap{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:12px;}
.ex-main{flex:1;min-width:0;}
.ex-name{font-weight:var(--weight-semibold);font-size:var(--text-base);color:var(--text-primary);}
.ex-setsreps{font-size:var(--text-xs);color:var(--text-tertiary);margin-top:2px;}
.ex-main.done{opacity:0.5;}
.ex-main.done .ex-name{text-decoration:line-through;}
.chev{flex:none;color:var(--text-tertiary);transition:transform var(--duration-fast) var(--ease-out);}
.chev.open{transform:rotate(180deg);}

/* ===== Checkbox ===== */
.checkbox{flex:none;width:20px;height:20px;border-radius:var(--radius-sm);border:1.5px solid var(--border-strong);background:var(--surface-raised);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out);}
.checkbox svg{width:12px;height:12px;stroke:var(--text-on-brand);stroke-width:3;fill:none;opacity:0;transition:opacity var(--duration-fast) var(--ease-out);}
.checkbox.checked{background:var(--surface-brand);border-color:var(--surface-brand);}
.checkbox.checked svg{opacity:1;}
.checkbox:focus-visible{outline:none;box-shadow:var(--shadow-focus);}

/* ===== Exercise detail ===== */
.ex-detail{padding:0 16px 18px;border-top:1px solid var(--border-default);}
.tempo{padding-top:14px;font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);}
.ex-knee{margin-top:10px;padding:8px 12px;background:var(--pink-50);border-radius:var(--radius-sm);font-size:var(--text-xs);color:var(--pink-700);}
.section-label{font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);}
.explanation{margin-top:4px;font-size:var(--text-sm);color:var(--text-primary);line-height:var(--leading-relaxed);}

/* ===== Weight logging ===== */
.weights{margin-top:14px;}
.weights .section-label{margin-bottom:8px;display:block;}
.set-rows{display:flex;flex-direction:column;gap:8px;}
.set-row{display:flex;align-items:center;gap:10px;}
.set-idx{width:20px;flex:none;font-size:var(--text-xs);color:var(--text-tertiary);font-weight:var(--weight-semibold);}
.set-prev{width:64px;flex:none;font-size:var(--text-xs);color:var(--text-tertiary);}
.set-input{flex:1;}
.set-unit{width:24px;flex:none;font-size:var(--text-xs);color:var(--text-tertiary);}

/* ===== Input ===== */
.input{width:100%;height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);font-family:var(--font-body);font-size:var(--text-sm);color:var(--text-primary);transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out);}
.input::placeholder{color:var(--text-tertiary);}
.input:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--shadow-focus);}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--text-secondary);}

/* ===== Button ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--radius-pill);font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--weight-semibold);cursor:pointer;border:none;transition:background var(--duration-fast) var(--ease-out),transform var(--duration-fast) var(--ease-out);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:none;box-shadow:var(--shadow-focus);}
.btn--sm36{height:36px;}
.btn--secondary{background:var(--surface-raised);border:1px solid var(--border-strong);color:var(--navy-700);}
.btn--secondary:hover{background:var(--surface-sunken);}
.btn--primary{background:var(--accent-primary);color:var(--text-on-brand);}
.btn--primary:hover{background:var(--accent-primary-hover);}
.btn--primary:active{background:var(--accent-primary-active);}
.btn-row{margin-top:14px;}

/* ===== Alternative panel ===== */
.alt{margin-top:14px;padding:14px;background:var(--surface-sunken);border-radius:var(--radius-md);}
.alt-label{font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:8px;}
.alt-media{display:flex;gap:10px;margin-bottom:10px;}
.media-photo{position:relative;width:96px;height:96px;flex:none;border-radius:10px;overflow:hidden;background:var(--gray-100);}
.media-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.media-photo .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:6px;color:var(--gray-500);font-size:var(--text-xs);line-height:var(--leading-snug);border:1px dashed var(--gray-300);border-radius:10px;background:var(--gray-100);}
.media-video{flex:none;width:96px;height:96px;border-radius:10px;background:var(--gray-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray-600);font-size:20px;text-decoration:none;}
.media-video span.lbl{font-size:var(--text-xs);color:var(--gray-600);}
.alt-name{font-weight:var(--weight-semibold);font-size:var(--text-sm);color:var(--text-primary);}
.alt-explanation{margin-top:4px;font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);}
.alt-missing{margin-top:14px;padding:12px 14px;background:var(--danger-100);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--danger-500);}

.footnote{padding:0 20px 32px;text-align:center;font-size:var(--text-xs);color:var(--text-tertiary);}

/* ===== InBody view ===== */
.inbody-intro{padding:16px 20px 8px;font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);}
.inbody-list{padding:0 20px 8px;display:flex;flex-direction:column;gap:10px;}
.inbody-card{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:14px 16px;}
.inbody-head{display:flex;align-items:center;justify-content:space-between;}
.inbody-date{font-weight:var(--weight-semibold);font-size:var(--text-sm);color:var(--text-primary);}
.inbody-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.metric-label{font-size:var(--text-xs);color:var(--text-tertiary);}
.metric-val{font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-primary);}
.metric-delta{font-size:var(--text-xs);color:var(--text-tertiary);}
.inbody-foot{display:flex;gap:16px;margin-top:10px;font-size:var(--text-xs);color:var(--text-tertiary);}
.inbody-foot b{color:var(--text-secondary);font-weight:var(--weight-medium);}
.inbody-form{margin:8px 20px 40px;padding:16px;background:var(--surface-sunken);border-radius:var(--radius-lg);}
.inbody-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-error{margin-top:8px;font-size:var(--text-xs);color:var(--danger-500);}

</style>

const INBODY_SEED = [
  { date: "27.04.2026", peso: 67.0, mme: 28.5, pgc: 23.4, cadera: 0.83, puntuacion: 84 },
  { date: "11.06.2026", peso: 66.6, mme: 28.6, pgc: 23.1, cadera: 0.85, puntuacion: 84 },
  { date: "21.07.2026", peso: 67.8, mme: 28.9, pgc: 23.2, cadera: 0.84, puntuacion: 85 },
];
const fmtDelta = (curr, prev, unit) => {
  if (prev == null) return "—";
  const d = Math.round((curr - prev) * 100) / 100;
  if (d === 0) return "sin cambio";
  return (d > 0 ? "+" : "") + d + unit + " vs. anterior";
};

/* ==================== State ==================== */
const state = {
  view: "routine", activeDay: 0,
  open: {}, altOpen: {}, completed: {}, weights: {},
  inbody: INBODY_SEED.map(r => ({ ...r })),
  newInbody: { date: "", peso: "", mme: "", pgc: "", cadera: "", puntuacion: "", error: "" },
};

/* ==================== Helpers ==================== */
const root = document.getElementById("root");
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 12 10 18 20 6"></polyline></svg>';

/* ==================== Views ==================== */
function headerHTML(){
  const isRoutine = state.view === "routine";
  const headerTitle = isRoutine ? DAYS[state.activeDay].label : "Historial InBody";
  const toggleLabel = isRoutine ? "InBody →" : "← Rutina";
  const tabs = DAYS.map((d, i) =>
    `<button class="daytab ${i === state.activeDay ? "active" : ""}" data-action="setDay" data-day="${i}">${esc(d.label)}</button>`
  ).join("");
  return `
    <div class="hdr">
      <div class="hdr-top">
        <div style="min-width:0;">
          <div class="eyebrow">Linis Gym App · Mesociclo actual</div>
          <h1>${esc(headerTitle)}</h1>
        </div>
        <button class="view-toggle" data-action="toggleView">${esc(toggleLabel)}</button>
      </div>
      ${isRoutine ? `<div class="daytabs">${tabs}</div>` : ""}
    </div>`;
}

function exerciseHTML(ex, i){
  const key = state.activeDay + "-" + i;
  const isOpen = !!state.open[key];
  const altOpen = !!state.altOpen[key];
  const completed = !!state.completed[key];
  const setsReps = ex.setCount + " x " + ex.repsLabel;
  const hasSets = !ex.noWeight;

  const badge = ex.category
    ? `<div style="flex:none;"><span class="badge badge--${esc(ex.tone || "neutral")}">${esc(ex.category)}</span></div>` : "";

  let detail = "";
  if (isOpen){
    const kneeInline = ex.kneeNote
      ? `<div class="ex-knee">⚠ ${esc(ex.kneeNote)}</div>` : "";

    let weightsBlock = "";
    if (hasSets){
      const rows = ex.prevWeights.map((pw, si) => {
        const wk = key + "-" + si;
        const val = state.weights[wk] ?? "";
        return `<div class="set-row">
            <div class="set-idx">${si + 1}</div>
            <div class="set-prev">${esc(pw)} kg ant.</div>
            <div class="set-input"><input class="input" inputmode="decimal" placeholder="${esc(pw)}" value="${esc(val)}" data-action="setWeight" data-wk="${wk}"></div>
            <div class="set-unit">kg</div>
          </div>`;
      }).join("");
      weightsBlock = `<div class="weights">
          <span class="section-label">Registrar peso</span>
          <div class="set-rows">${rows}</div>
        </div>`;
    }

    let altBlock = "";
    if (altOpen){
      if (ex.hasAlt){
        altBlock = `<div class="alt">
            <div class="alt-label">Alternativa · máquina ocupada</div>
            <div class="alt-media">
              <div class="media-photo">
                <img src="${esc(ex.altPhoto)}" alt="${esc(ex.altName)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                <div class="ph">Foto máquina Bodytech</div>
              </div>
              <a class="media-video" href="${esc(yt(ex.altName + " técnica ejecución"))}" target="_blank" rel="noopener">
                <span>▶</span><span class="lbl">Ver video</span>
              </a>
            </div>
            <div class="alt-name">${esc(ex.altName)}</div>
            <div class="alt-explanation">${esc(ex.altExplanation)}</div>
          </div>`;
      } else {
        altBlock = `<div class="alt-missing">Este ejercicio no tiene alternativa registrada.</div>`;
      }
    }

    detail = `<div class="ex-detail">
        <div class="tempo">${esc(ex.tempoNote)}</div>
        ${kneeInline}
        <div class="section-label" style="margin-top:12px;">Técnica</div>
        <div class="explanation">${esc(ex.explanation)}</div>
        ${weightsBlock}
        <div class="btn-row">
          <button class="btn btn--secondary" data-action="toggleAlt" data-key="${key}">${altOpen ? "Ocultar alternativa" : "Ver alternativa"}</button>
        </div>
        ${altBlock}
      </div>`;
  }

  return `<div class="ex">
      <div class="ex-head">
        <button class="checkbox ${completed ? "checked" : ""}" data-action="toggleComplete" data-key="${key}" aria-label="Marcar completado" aria-pressed="${completed}">${CHECK_SVG}</button>
        <div class="ex-tap" data-action="toggleOpen" data-key="${key}">
          <div class="ex-main ${completed ? "done" : ""}">
            <div class="ex-name">${esc(ex.name)}</div>
            <div class="ex-setsreps">${esc(setsReps)}</div>
          </div>
          ${badge}
          <div class="chev ${isOpen ? "open" : ""}" aria-hidden="true">▾</div>
        </div>
      </div>
      ${detail}
    </div>`;
}

function routineBodyHTML(){
  const day = DAYS[state.activeDay];
  const knee = day.knee
    ? `<div class="knee-note">Recordatorio fijo: rango controlado en ejercicios de rodilla marcados abajo — nunca profundidad completa. Sin ejercicios de pecho ni pantorrilla.</div>` : "";
  const tags = day.tags
    ? `<div class="legend">
        <span class="tag">🟣 Activator = carga pesada, acortado</span>
        <span class="tag">🟠 Stretcher = carga en elongación</span>
        <span class="tag">🟡 Pumper = alto rango, bombeo</span>
      </div>` : "";
  const list = day.exercises.map((ex, i) => exerciseHTML(ex, i)).join("");
  return `
    <div class="day-focus">${esc(day.focusNote)}</div>
    ${knee}
    ${tags}
    <div class="list">${list}</div>
    <div class="footnote">Fotos de máquina: reemplázalas cuando tengas las de Bodytech Usaquén. Video: abre una búsqueda en YouTube por ahora.</div>`;
}

function inbodyBodyHTML(){
  // history: oldest→newest for deltas, displayed newest first
  const rows = state.inbody.map((row, i) => {
    const prev = i > 0 ? state.inbody[i - 1] : null;
    return {
      date: row.date,
      isLatest: i === state.inbody.length - 1,
      peso: row.peso + " kg", pesoDelta: fmtDelta(row.peso, prev && prev.peso, " kg"),
      mme: row.mme + " kg", mmeDelta: fmtDelta(row.mme, prev && prev.mme, " kg"),
      pgc: row.pgc + "%", pgcDelta: fmtDelta(row.pgc, prev && prev.pgc, "pp"),
      cadera: row.cadera, puntuacion: row.puntuacion + "/100",
    };
  }).reverse();

  const cards = rows.map(r => `
    <div class="inbody-card">
      <div class="inbody-head">
        <div class="inbody-date">${esc(r.date)}</div>
        ${r.isLatest ? `<span class="badge badge--brand">Más reciente</span>` : ""}
      </div>
      <div class="inbody-grid">
        <div><div class="metric-label">Peso</div><div class="metric-val">${esc(r.peso)}</div><div class="metric-delta">${esc(r.pesoDelta)}</div></div>
        <div><div class="metric-label">MME</div><div class="metric-val">${esc(r.mme)}</div><div class="metric-delta">${esc(r.mmeDelta)}</div></div>
        <div><div class="metric-label">PGC</div><div class="metric-val">${esc(r.pgc)}</div><div class="metric-delta">${esc(r.pgcDelta)}</div></div>
      </div>
      <div class="inbody-foot">
        <div>Cintura-cadera: <b>${esc(r.cadera)}</b></div>
        <div>Puntuación InBody: <b>${esc(r.puntuacion)}</b></div>
      </div>
    </div>`).join("");

  const nf = state.newInbody;
  const field = (label, ph, key) =>
    `<div class="field"><label>${esc(label)}</label><input class="input" placeholder="${esc(ph)}" value="${esc(nf[key])}" data-action="setInbody" data-field="${key}"></div>`;

  return `
    <div class="inbody-intro">Historial de mediciones. Un InBody nuevo se registra aquí, pero no dispara un rediseño automático de la rutina — eso solo pasa si reportas una señal real (estancamiento, desbalance, plateau).</div>
    <div class="inbody-list">${cards}</div>
    <div class="inbody-form">
      <div class="section-label" style="margin-bottom:10px;">Registrar nueva medición</div>
      <div class="inbody-form-grid">
        ${field("Fecha", "DD.MM.AAAA", "date")}
        ${field("Peso (kg)", "67.0", "peso")}
        ${field("MME (kg)", "28.9", "mme")}
        ${field("PGC (%)", "23.2", "pgc")}
        ${field("Cintura-cadera", "0.84", "cadera")}
        ${field("Puntuación", "85", "puntuacion")}
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn--primary btn--sm36" data-action="saveInbody">Guardar medición</button>
      </div>
      ${nf.error ? `<div class="form-error">${esc(nf.error)}</div>` : ""}
    </div>`;
}

/* ==================== Render ==================== */
function render(){
  const scrollY = window.scrollY;
  const body = state.view === "routine" ? routineBodyHTML() : inbodyBodyHTML();
  root.innerHTML = headerHTML() + body;
  window.scrollTo(0, scrollY);
}

/* ==================== Events ==================== */
// Clicks (structural changes → re-render)
root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");

  switch (action){
    case "toggleView":
      state.view = state.view === "routine" ? "inbody" : "routine";
      render();
      break;
    case "setDay": {
      const i = +el.getAttribute("data-day");
      if (i !== state.activeDay){ state.activeDay = i; state.open = {}; state.altOpen = {}; }
      render();
      break;
    }
    case "toggleOpen": {
      const k = el.getAttribute("data-key");
      state.open[k] = !state.open[k];
      render();
      break;
    }
    case "toggleComplete": {
      const k = el.getAttribute("data-key");
      state.completed[k] = !state.completed[k];
      render();
      break;
    }
    case "toggleAlt": {
      const k = el.getAttribute("data-key");
      state.altOpen[k] = !state.altOpen[k];
      render();
      break;
    }
    case "saveInbody":
      saveInbody();
      break;
  }
});

// Input (silent state updates → no re-render, preserves focus while typing)
root.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  if (action === "setWeight"){
    state.weights[el.getAttribute("data-wk")] = el.value;
  } else if (action === "setInbody"){
    state.newInbody[el.getAttribute("data-field")] = el.value;
    state.newInbody.error = "";
  }
});

function saveInbody(){
  const f = state.newInbody;
  if (!f.date || !f.peso || !f.mme || !f.pgc || !f.cadera || !f.puntuacion){
    state.newInbody.error = "Completa los 6 campos antes de guardar.";
    render();
    return;
  }
  state.inbody.push({
    date: f.date, peso: parseFloat(f.peso), mme: parseFloat(f.mme), pgc: parseFloat(f.pgc),
    cadera: parseFloat(f.cadera), puntuacion: parseFloat(f.puntuacion),
  });
  state.newInbody = { date: "", peso: "", mme: "", pgc: "", cadera: "", puntuacion: "", error: "" };
  render();
}

render();
</script>
