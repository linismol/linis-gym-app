<style>
/* ===== Nocturne design system — tokens (source of truth: styles.css) ===== */
:root{
  --color-bg:#161826;
  --color-surface:#232532;
  --color-text:#e9e9ed;
  --color-accent:#9184d9;
  --color-accent-2:#a7a1db;
  --color-divider:color-mix(in srgb, #e9e9ed 16%, transparent);

  --color-neutral-100:#f3f5fe;--color-neutral-200:#e4e7f5;--color-neutral-300:#cfd3e5;--color-neutral-400:#b2b6ca;--color-neutral-500:#9397ab;--color-neutral-600:#75798c;--color-neutral-700:#595d6c;--color-neutral-800:#3f424d;--color-neutral-900:#292b31;

  --color-accent-100:#f5f4ff;--color-accent-200:#e7e5fe;--color-accent-300:#d2cefd;--color-accent-400:#b5abfc;--color-accent-500:#968ae0;--color-accent-600:#796cbf;--color-accent-700:#5d5294;--color-accent-800:#423a6a;--color-accent-900:#2b2741;

  --color-accent-2-100:#f5f4ff;--color-accent-2-200:#e7e5fe;--color-accent-2-300:#d2cefd;--color-accent-2-400:#b5afe8;--color-accent-2-500:#9690c9;--color-accent-2-600:#7972a9;--color-accent-2-700:#5c5783;--color-accent-2-800:#423e5d;--color-accent-2-900:#2b293a;

  --font-heading:"Inter",system-ui,sans-serif;
  --font-heading-weight:500;
  --font-body:"Inter",system-ui,sans-serif;

  --space-1:2.8px;--space-2:5.6px;--space-3:8.4px;--space-4:11.2px;--space-6:16.8px;--space-8:22.4px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;

  --shadow-sm:0 0 0 1px #3f424d;
  --shadow-md:0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg:0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
h2{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.12;letter-spacing:-0.015em;font-size:28px;margin:0;}
a{color:var(--color-accent);text-decoration:none;text-underline-offset:3px;}
a:hover{color:var(--color-accent-300);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent);}
.lighten{mix-blend-mode:lighten;background-color:transparent;}

/* buttons — outlined, never filled (Nocturne signature) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:14px;line-height:1.2;color:var(--color-text);background:transparent;border:1px solid transparent;padding:var(--space-2) calc(var(--space-3)*1.2);border-radius:var(--radius-md);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent);}
.btn-primary:hover{background:color-mix(in srgb, var(--color-accent) 12%, transparent);}
.btn-primary:active{background:color-mix(in srgb, var(--color-accent) 22%, transparent);}
.btn-secondary{border-color:var(--color-divider);}
.btn-secondary:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);}
.btn-secondary:active{background:color-mix(in srgb, var(--color-text) 14%, transparent);}

/* forms */
.field>label{display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);}
.input::placeholder{color:var(--color-neutral-500);}
.input:hover{border-color:color-mix(in srgb, var(--color-text) 45%, transparent);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}

/* cards */
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface);}
.card-kicker{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent);}
.elev-sm{box-shadow:var(--shadow-sm);}

/* tags */
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:0.02em;padding:3px 10px;border-radius:calc(var(--radius-md)*0.75);white-space:nowrap;}
.tag-accent{background:var(--color-accent-800);color:var(--color-accent-100);}
.tag-accent-2{background:var(--color-accent-2-800);color:var(--color-accent-2-100);}
.tag-neutral{background:var(--color-neutral-800);color:var(--color-neutral-100);}

/* app-specific (from the .dc helmet) */
.chev{transition:transform 120ms ease-out;color:var(--color-neutral-500);flex:none;}
.daytab{padding:8px 12px;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:var(--font-body);font-size:13px;white-space:nowrap;color:var(--color-neutral-500);transition:color 120ms ease-out;}
.daytab.active{color:var(--color-accent);border-bottom-color:var(--color-accent);}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--color-divider);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--color-bg);}
.chk.done{background:var(--color-accent);border-color:var(--color-accent);}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-lg);}
.hdr{position:sticky;top:0;z-index:20;background:var(--color-bg);border-bottom:1px solid var(--color-divider);padding-top:env(safe-area-inset-top,0px);}
.hdr-top{padding:16px 20px 4px;}
.eyebrow{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent);}
.tabrow{display:flex;overflow-x:auto;padding:8px 12px 0;gap:2px;scrollbar-width:none;}
.tabrow::-webkit-scrollbar{display:none;}
.tabrow.days{padding:6px 12px 0;border-top:1px solid var(--color-divider);}
.muted{color:var(--color-neutral-500);}
</style>
</head>

const fmtDelta = (curr, prev, unit) => {
  if (prev == null) return "—";
  const d = Math.round((curr - prev) * 100) / 100;
  if (d === 0) return "sin cambio";
  return (d > 0 ? "+" : "") + d + unit + " vs. anterior";
};

  }).join("");
}

      peso: row.peso + " kg", pesoDelta: fmtDelta(row.peso, prev && prev.peso, " kg"),

      pgc: row.pgc + "%", pgcDelta: fmtDelta(row.pgc, prev && prev.pgc, "pp"),
      cadera: row.cadera, puntuacion: row.puntuacion + "/100",
    };
  }).reverse();

  const metric = (label, val, delta) =>
    `<div><div style="font-size:11px;" class="muted">${label}</div><div style="font-size:13px;font-weight:500;">${esc(val)}</div><div style="font-size:11px;" class="muted">${esc(delta)}</div></div>`;

  const cards = rows.map(r => `

function checkupBodyHTML(){
  const flags = MAIN_COMPOUNDS.filter(c => c.sessions.every(v => v === c.sessions[0]))
    .map(c => ({ name: c.name, day: c.day, reason: `${c.sessions.length} sesiones seguidas en ${c.sessions[0]} kg` }));
  const lastInbody = state.inbody[state.inbody.length - 1];
  const weeksSince = Math.floor((TODAY - parseDDMMYYYY(lastInbody.date)) / (1000 * 60 * 60 * 24 * 7));
  const inbodyMessage = weeksSince >= 6
    ? `Última medición hace ${weeksSince} semanas (${lastInbody.date}) — toca InBody nuevo.`
    : `Última medición hace ${weeksSince} semanas (${lastInbody.date}). Faltan ${6 - weeksSince}-${8 - weeksSince} semanas para la ventana de 6-8 semanas.`;
  const mme = state.inbody.map(r => r.mme);
  const mmeMessage = mme.length < 3
    ? "MME: faltan mediciones para evaluar plateau (se necesitan al menos 2-3 seguidas)."
    : (mme[mme.length-1] === mme[mme.length-2] && mme[mme.length-2] === mme[mme.length-3]
      ? "MME sin cambio en las últimas 3 mediciones — posible plateau."
      : "MME viene subiendo entre mediciones — sin señal de plateau.");

  const routineCard = flags.length === 0
    ? `<div style="font-size:13px;line-height:1.55;margin-top:6px;">Todo progresando, sin señales de estancamiento.</div>`
    : `<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">${flags.map(fl =>
        `<div style="padding:10px 12px;background:var(--color-accent-900);border-radius:var(--radius-sm);">
          <div style="font-size:13px;font-weight:500;color:var(--color-accent-200);">${esc(fl.name)}</div>
          <div style="font-size:11px;color:var(--color-accent-300);margin-top:2px;">${esc(fl.day)} · ${esc(fl.reason)}</div>
        </div>`).join("")}</div>`;

  return `
    <div style="padding:16px 20px 8px;"><div style="font-size:13px;opacity:0.8;line-height:1.55;">Solo señala — la decisión de qué hacer con esto sigue siendo tuya.</div></div>
    <div style="padding:0 20px 40px;display:flex;flex-direction:column;gap:12px;">
      <div class="card elev-sm">
        <div class="card-kicker">InBody</div>
        <div style="font-size:13px;line-height:1.55;margin-top:6px;">${esc(inbodyMessage)}</div>
      </div>
      <div class="card elev-sm">
        <div class="card-kicker">Rutina</div>
        ${routineCard}
        <div style="font-size:11px;margin-top:10px;" class="muted">${esc(mmeMessage)}</div>
      </div>
    </div>`;
}

function summaryBodyHTML(){

        </div>`).join("")}

  const analysisDisabled = HAS_CLAUDE ? "" : "disabled";

    <div style="padding:14px 20px 8px;">
      <div class="card elev-sm">

        ${analysisInner}

      </div>

      <div class="card elev-sm" style="gap:0;padding:0;overflow:hidden;">
        <div class="card-kicker" style="padding:16px 16px 8px;">Pregúntale a /gym-coach</div>
        <div style="max-height:280px;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px;">
          ${chatBubbles || `<div style="font-size:12px;" class="muted">${HAS_CLAUDE ? "Escribe una pregunta para empezar." : "Chat disponible dentro de la app de Claude."}</div>`}
          ${state.chatLoading ? `<div style="font-size:12px;" class="muted">/gym-coach está escribiendo...</div>` : ""}
        </div>
        <div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--color-divider);">
          <input class="input" style="flex:1;" placeholder="Ej: ¿debería subir peso en hip thrust?" value="${esc(state.chatInput)}" data-action="setChat" ${HAS_CLAUDE ? "" : "disabled"}>
          <button class="btn btn-primary" data-action="sendChat" ${HAS_CLAUDE ? "" : "disabled"}>Enviar</button>
        </div>
      </div>
    </div>
    <div style="padding:14px 20px 40px;display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;" class="muted">Datos base de esta semana</div>
      ${daysData}
    </div>`;
}

/* ==================== Render ==================== */
function render(){
  const scrollY = window.scrollY;
  let body;
  switch (state.view){
    case "inbody": body = inbodyBodyHTML(); break;
    case "checkup": body = checkupBodyHTML(); break;
    case "summary": body = summaryBodyHTML(); break;
    default: body = routineBodyHTML();
  }
  root.innerHTML = headerHTML() + body;
  window.scrollTo(0, scrollY);
}

/* ==================== AI (window.claude.complete) ==================== */
function buildSummarySnapshot(){
  const txt = DAYS.map((d, di) => {
    const lines = d.exercises.filter(ex => !ex.noWeight).map((ex, ei) => {
      const key = `${di}-${ei}-0`;
      const tw = state.weights[key];
      return `  ${ex.name}: ${tw ? `${tw} kg (ant. ${ex.prevWeights[0]} kg)` : `sin registrar (ant. ${ex.prevWeights[0]} kg)`}`;
    });
    return `${d.label}\n${lines.join("\n")}`;
  }).join("\n\n");
  summaryTextSnapshot = txt;
  return txt;
}

async function runAnalysis(){
  const context = buildSummarySnapshot();
  if (!HAS_CLAUDE){
    state.analysisError = NO_CLAUDE_MSG;
    state.analysisFetchedFor = context;
    render();
    return;
  }
  state.loadingAnalysis = true; state.analysisError = ""; state.analysisFetchedFor = context;
  render();
  try {
    const text = await window.claude.complete(
      `Eres /gym-coach, entrenador de fuerza e hipertrofia de Lina, enfocado en volumen de pierna y glúteo. ` +
      `Con este historial de peso registrado esta semana vs. la semana anterior, y el historial de InBody, da un análisis breve (4-6 líneas): qué progresó, qué se estancó, y una recomendación concreta. No apliques cambios, solo recomienda. Responde en texto plano, sin markdown (nada de #, **, -, etc.).\n\n` +
      `Datos de la semana:\n${context}\n\nHistorial InBody:\n${INBODY_SEED.map(r => `${r.date}: peso ${r.peso}kg, MME ${r.mme}kg, PGC ${r.pgc}%`).join("\n")}`
    );
    state.analysisText = text; state.loadingAnalysis = false;
  } catch (e) {
    state.analysisError = "No se pudo generar el análisis en este momento. Intenta de nuevo."; state.loadingAnalysis = false;
  }
  render();
}

async function sendChat(){
  const question = state.chatInput.trim();
  if (!question || !HAS_CLAUDE) return;
  state.chatMessages = [...state.chatMessages, { role: "user", text: question }];
  state.chatInput = ""; state.chatLoading = true;
  render();
  try {
    const text = await window.claude.complete(
      `Eres /gym-coach, entrenador de fuerza e hipertrofia de Lina (glúteo y pierna). Contexto de su semana:\n${summaryTextSnapshot}\n\nPregunta de Lina: ${question}\n\nResponde breve y concreto, sin aplicar cambios a la rutina por tu cuenta. Responde en texto plano, sin markdown (nada de #, **, -, etc.).`
    );
    state.chatMessages = [...state.chatMessages, { role: "assistant", text }]; state.chatLoading = false;
  } catch (e) {
    state.chatMessages = [...state.chatMessages, { role: "assistant", text: "No pude responder en este momento, intenta de nuevo." }]; state.chatLoading = false;
  }
  render();
}

/* ==================== Events ==================== */
root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.getAttribute("data-action");
  if (a === "setView"){
    const v = el.getAttribute("data-view");
    state.view = v;
    render();
    if (v === "summary" && state.analysisFetchedFor !== buildSummarySnapshot()) runAnalysis();
  } else if (a === "setDay"){
    const i = +el.getAttribute("data-day");
    if (i !== state.activeDay){ state.activeDay = i; state.open = {}; state.altOpen = {}; }
    render();
  } else if (a === "toggleOpen"){
    const k = el.getAttribute("data-key"); state.open[k] = !state.open[k]; render();
  } else if (a === "toggleComplete"){
    const k = el.getAttribute("data-key"); state.completed[k] = !state.completed[k]; render();
  } else if (a === "toggleAlt"){
    const k = el.getAttribute("data-key"); state.altOpen[k] = !state.altOpen[k]; render();
  } else if (a === "saveInbody"){
    saveInbody();
  } else if (a === "refreshAnalysis"){
    runAnalysis();
  } else if (a === "sendChat"){
    sendChat();
  }
});

// silent state updates while typing (no re-render → focus preserved)
root.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.getAttribute("data-action");
  if (a === "setWeight") state.weights[el.getAttribute("data-wk")] = el.value;
  else if (a === "setInbody"){ state.newInbody[el.getAttribute("data-field")] = el.value; state.newInbody.error = ""; }
  else if (a === "setChat") state.chatInput = el.value;
});

// on blur of a weight field: recompute auto-complete, then re-render
root.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action='setWeight']");
  if (!el) return;
  const exkey = el.getAttribute("data-exkey");
  const setCount = +el.getAttribute("data-setcount");
  const filled = prefix => Array.from({ length: setCount }, (_, i) => state.weights[`${prefix}${i}`]).every(v => v);
  if (filled(`${exkey}-`) || filled(`${exkey}-alt-`)) state.completed[exkey] = true;
  render();
});

function saveInbody(){
  const f = state.newInbody;
  if (!f.date || !f.peso || !f.mme || !f.pgc || !f.cadera || !f.puntuacion){
    state.newInbody.error = "Completa los 6 campos antes de guardar."; render(); return;
  }
  state.inbody.push({ date: f.date, peso: parseFloat(f.peso), mme: parseFloat(f.mme), pgc: parseFloat(f.pgc), cadera: parseFloat(f.cadera), puntuacion: parseFloat(f.puntuacion) });
  state.newInbody = { date: "", peso: "", mme: "", pgc: "", cadera: "", puntuacion: "", error: "" };
  render();
}

render();
</script>
</body>
</html>
