name: Deploy /gym-coach function

# Despliega la Azure Function del proxy (carpeta azure-coach/) cuando cambia
# su código, o manualmente desde la pestaña Actions (Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "azure-coach/**"
      - ".github/workflows/deploy-coach.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          # ⚠️ Cambia este nombre por el de TU Function App si es distinto.
          app-name: linis-coach-fn
          package: azure-coach
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
